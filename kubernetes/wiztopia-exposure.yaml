---
# GKE re-target of the shipped AWS ALB Ingress (kubernetes/wiztopia-ingress.yaml). The ALB used an
# IngressGroup to merge two Ingresses into one internet-facing load balancer with path routing; the GCE
# equivalent is one Ingress that provisions a GCP HTTP(S) Load Balancer with the same path map. The
# frontend serves relative /products,/promo,/cart,/checkout fetches, so those prefixes route to the
# backend and everything else to the frontend -- identical to the ALB's routing.
#
# The shipped NetworkPolicy pinned frontend ingress to four hard-coded AWS CIDRs; on GKE those addresses
# are meaningless and the policy would block ALL traffic, so it is dropped rather than re-authored. The
# scenario's public reach is intentional (wiz-ingress is off; agentless scanning reads the cloud API).
#
# Both Services this routes to are NodePort (see the workload manifests). GKE derives each backend's
# health check from the pods' readiness probe where one exists (the backend probes /products/toys) and
# from GET / otherwise (the Next.js standalone server answers 200 on /).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wiztopia-ingress
  namespace: wiztopia
  annotations:
    kubernetes.io/ingress.class: "gce"
spec:
  rules:
  - http:
      paths:
      - path: /products
        pathType: Prefix
        backend:
          service:
            name: wiztopia-backend
            port:
              number: 4000
      - path: /promo
        pathType: Prefix
        backend:
          service:
            name: wiztopia-backend
            port:
              number: 4000
      - path: /cart
        pathType: Prefix
        backend:
          service:
            name: wiztopia-backend
            port:
              number: 4000
      - path: /checkout
        pathType: Prefix
        backend:
          service:
            name: wiztopia-backend
            port:
              number: 4000
      - path: /healthz
        pathType: Prefix
        backend:
          service:
            name: wiztopia-backend
            port:
              number: 4000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: wiztopia-toystore
            port:
              number: 80
