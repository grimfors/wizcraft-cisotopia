---
# GKE re-target of the shipped frontend manifest. Diffs from upstream:
#   - Service type NodePort (was ClusterIP) -- the GCE Ingress load-balances to node ports.
#   - image is the us-central1-docker.pkg.dev/p-5xsmzvkzytoz-0/wizcraft-app-ece1c8/wiztopia-toystore@sha256:62cedcf219941f4513bd6d33a9b223fa4553f184b18284d2e25303f4d9382242 tag the LEARNER builds, scans and pushes in challenge 2; setup
#     renders the registry path but never builds it, so the digest that ends up running is the
#     learner's. This is the vulnerable image (next 16.0.6) the admission gate blocks in challenge 3.
# The elevated ClusterRole/binding is kept verbatim from the app: it is a real over-privileged RBAC
# artifact the app ships, not a track invention.
apiVersion: v1
kind: ConfigMap
metadata:
  name: wiztopia-toystore-config
  namespace: wiztopia
data:
  PORT: "3000"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wiztopia-toystore
  namespace: wiztopia
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wiztopia-toystore
  template:
    metadata:
      labels:
        app: wiztopia-toystore
    spec:
      serviceAccountName: wiztopia-db-sa
      containers:
      - name: wiztopia-toystore
        image: "us-central1-docker.pkg.dev/p-5xsmzvkzytoz-0/wizcraft-app-ece1c8/wiztopia-toystore@sha256:62cedcf219941f4513bd6d33a9b223fa4553f184b18284d2e25303f4d9382242"
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: wiztopia-toystore-config
        env:
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "400m"

---
apiVersion: v1
kind: Service
metadata:
  name: wiztopia-toystore
  namespace: wiztopia
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 3000
    name: http
  selector:
    app: wiztopia-toystore

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: toystore-elevated-access
rules:
- apiGroups:
  - ""
  resources:
  - pods
  - pods/exec
  - pods/log
  - secrets
  - configmaps
  - services
  verbs:
  - get
  - list
  - create
  - delete
  - exec
- apiGroups:
  - apps
  resources:
  - deployments
  - daemonsets
  - statefulsets
  verbs:
  - get
  - list
  - create
  - delete
  - patch
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: wiztopia-db-sa-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: toystore-elevated-access
subjects:
- kind: ServiceAccount
  name: wiztopia-db-sa
  namespace: wiztopia
