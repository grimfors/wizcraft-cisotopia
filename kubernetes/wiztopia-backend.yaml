---
# GKE re-target of the shipped AWS/EKS backend manifest. setup renders the __TOKENS__ and writes this
# over the app clone's kubernetes/wiztopia-backend.yaml. Diffs from upstream, each load-bearing:
#   - DATABASE_CLIENT: sqlite3 (was "pg") -- knex falls back to a file-backed sqlite3 db when the
#     client is not pg, so the readiness probe (/products/toys -> a knex query) returns 200 with no
#     external database. With "pg" + a placeholder DATABASE_URL the query throws and the pods never
#     become Ready, which would fail challenge 2's "workloads healthy" leg.
#   - ServiceAccount annotation iam.gke.io/gcp-service-account (was eks.amazonaws.com/role-arn) -- the
#     GKE Workload Identity binding that replaces the AWS IRSA annotation; the GSA is bound to this KSA
#     in terraform/scenario.
#   - Service type NodePort (was ClusterIP) -- the GCE Ingress in wiztopia-exposure.yaml load-balances
#     to node ports.
apiVersion: v1
kind: Namespace
metadata:
  name: wiztopia
  labels:
    name: wiztopia

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wiztopia-backend-config
  namespace: wiztopia
data:
  PORT: "4000"
  NODE_ENV: "production"
  # sqlite3 fallback: no external DB, so the readiness probe's knex query succeeds in-pod.
  DATABASE_CLIENT: "sqlite3"
  DB_POOL_MIN: "2"
  DB_POOL_MAX: "10"
  REDIS_SESSION_URL: "redis://redis-session:6379/0"
  REDIS_CART_URL: "redis://redis-cart:6379/1"
  CORS_ORIGIN: "*"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: wiztopia
data:
  redis.conf: |
    bind 0.0.0.0
    protected-mode no
    port 6379
    maxmemory 128mb
    maxmemory-policy allkeys-lru

---
# The shared app ServiceAccount. The GKE Workload Identity annotation replaces the shipped AWS IRSA
# one; terraform binds this KSA (wiztopia/wiztopia-db-sa) to the workload GSA below.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wiztopia-db-sa
  namespace: wiztopia
  annotations:
    iam.gke.io/gcp-service-account: "wizcraft-app-ece1c8@p-5xsmzvkzytoz-0.iam.gserviceaccount.com"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wiztopia-backend
  namespace: wiztopia
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wiztopia-backend
  template:
    metadata:
      labels:
        app: wiztopia-backend
    spec:
      serviceAccountName: wiztopia-db-sa
      containers:
      - name: wiztopia-backend
        # setup pre-publishes this image and pins it by digest; challenge 2 grades that the backend
        # runs exactly this digest.
        image: "us-central1-docker.pkg.dev/p-5xsmzvkzytoz-0/wizcraft-app-ece1c8/wiztopia-backend@sha256:4f68dfe785422fd4d28cceaa60ef06a8e224f643ea5870f4fff9bb3e6c4bc6f9"
        ports:
        - containerPort: 4000
        envFrom:
        - configMapRef:
            name: wiztopia-backend-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "800m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 4000
          initialDelaySeconds: 30
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /healthz
            port: 4000
          initialDelaySeconds: 10
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: wiztopia-backend
  namespace: wiztopia
spec:
  type: NodePort
  ports:
  - port: 4000
    targetPort: 4000
  selector:
    app: wiztopia-backend

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-session
  namespace: wiztopia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-session
  template:
    metadata:
      labels:
        app: redis-session
    spec:
      containers:
      - name: redis
        image: redis:7.4-alpine
        command: ["redis-server", "/etc/redis/redis.conf"]
        volumeMounts:
        - name: config
          mountPath: /etc/redis
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
      volumes:
      - name: config
        configMap:
          name: redis-config

---
apiVersion: v1
kind: Service
metadata:
  name: redis-session
  namespace: wiztopia
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: redis-session

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cart
  namespace: wiztopia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-cart
  template:
    metadata:
      labels:
        app: redis-cart
    spec:
      containers:
      - name: redis
        image: redis:7.4-alpine
        command: ["redis-server", "/etc/redis/redis.conf"]
        volumeMounts:
        - name: config
          mountPath: /etc/redis
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
      volumes:
      - name: config
        configMap:
          name: redis-config

---
apiVersion: v1
kind: Service
metadata:
  name: redis-cart
  namespace: wiztopia
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: redis-cart
